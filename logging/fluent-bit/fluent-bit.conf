[SERVICE]
    Flush           1
    Daemon          Off
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf

[INPUT]
    Name            tail
    Path            /var/log/medchain/*.jsonl
    Parser          medchain_json
    Tag             medchain.app
    Mem_Buf_Limit   20MB
    Skip_Long_Lines On
    Refresh_Interval 5

[FILTER]
    Name            parser
    Match           medchain.app
    Key_Name        log
    Parser          medchain_json
    Reserve_Data    On
    Preserve_Key    Off

[FILTER]
    Name            modify
    Match           medchain.*
    Add             environment ${LOG_ENVIRONMENT}

[OUTPUT]
    Name            es
    Match           medchain.*
    Host            ${ELASTICSEARCH_HOST}
    Port            ${ELASTICSEARCH_PORT}
    Index           medchain-logs
    Logstash_Format  Off
    Suppress_Type_Name On
    Replace_Dots    On
    Retry_Limit     False
