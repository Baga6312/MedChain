name: Build and Push Docker Images

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/medchain-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/medchain-${{ matrix.service }}:1.0.${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/medchain-${{ matrix.service }}:${{ github.sha }}

  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { src: "ghcr.io/foundry-rs/foundry:latest", dst: "medchain-chain:latest" }
          - { src: "docker.elastic.co/elasticsearch/elasticsearch:8.15.3", dst: "medchain-elasticsearch:8.15.3" }
          - { src: "docker.elastic.co/kibana/kibana:8.15.3", dst: "medchain-kibana:8.15.3" }
          - { src: "fluent/fluent-bit:3.1", dst: "medchain-fluent-bit:3.1" }
          - { src: "redis:7-alpine", dst: "medchain-redis:7-alpine" }
          - { src: "postgres:16", dst: "medchain-postgres:16" }
          - { src: "nginx:alpine", dst: "medchain-gateway:alpine" }
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Mirror image
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.dst }} \
            ${{ matrix.src }}