
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: medchain
  labels:
    app: kibana

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kibana

  template:
    metadata:
      labels:
        app: kibana

    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.5.6
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5601
              protocol: TCP

          # Connexion à Elasticsearch
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"

            - name: SERVER_HOST
              value: "0.0.0.0"

            - name: SERVER_PORT
              value: "5601"

          # Ressources pour Minikube
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"

          # Laisser du temps à Kibana pour démarrer
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60

          # Vérifier que Kibana est prêt
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          # Vérifier que Kibana reste accessible
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: medchain
  labels:
    app: kibana

spec:
  type: ClusterIP

  selector:
    app: kibana

  ports:
    - name: http
      port: 5601
      targetPort: http
      protocol: TCP
