apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: medchain
  name: medchain
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [medchain.dev]
      secretName: medchain-tls
  rules:
    - host: medchain.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
