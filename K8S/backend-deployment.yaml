apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: medchain
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: prepare-logs
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /app/logs && chmod 0777 /app/logs
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      containers:
        - name: backend
          image: r1bit99/medchain-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - >
              python manage.py migrate &&
              python manage.py seed &&
              python manage.py recover_anchors &&
              gunicorn config.wsgi:application
              --bind 0.0.0.0:${BACKEND_PORT}
              --worker-tmp-dir /dev/shm
              --access-logfile -
              --error-logfile -
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          envFrom:
            - configMapRef:
                name: medchain-config
            - secretRef:
                name: medchain-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: logs
          emptyDir: {}