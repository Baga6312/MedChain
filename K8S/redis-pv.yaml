apiVersion: v1
kind: PersistentVolume
metadata:
  namespace: medchain
  name: redis-data-pv
  labels:
    app: redis
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/lib/medchain/redis
    type: DirectoryOrCreate