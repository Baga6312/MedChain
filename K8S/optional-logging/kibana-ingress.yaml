apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana-ts
  namespace: medchain
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "100.64.0.0/10"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [kibana.medchain.dev]
      secretName: wildcard-medchain-dev
  rules:
    - host: kibana.medchain.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana
                port:
                  number: 5601
