apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ts
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "100.64.0.0/10"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [grafana.medchain.dev]
      secretName: wildcard-medchain-dev
  rules:
    - host: grafana.medchain.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80
