apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medchain-logging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Baga6312/MedChain
    targetRevision: HEAD
    path: K8S/optional-logging
  destination:
    server: https://kubernetes.default.svc
    namespace: medchain
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
