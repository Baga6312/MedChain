apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ts
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "100.64.0.0/10"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [argocd.medchain.dev]
      secretName: wildcard-medchain-dev
  rules:
    - host: argocd.medchain.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
