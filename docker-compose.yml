services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - elasticsearchdata:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_EXTERNAL_PORT}:${ELASTICSEARCH_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${ELASTICSEARCH_PORT}/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      SERVER_PORT: ${KIBANA_PORT}
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "${KIBANA_EXTERNAL_PORT}:${KIBANA_PORT}"

  fluent-bit:
    image: fluent/fluent-bit:3.1
    user: root
    volumes:
      - ./logging/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./logging/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./logs:/var/log/medchain:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      LOG_ENVIRONMENT: ${LOG_ENVIRONMENT:?LOG_ENVIRONMENT is required}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:?ELASTICSEARCH_HOST is required}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:?ELASTICSEARCH_PORT is required}

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_EXTERNAL_PORT}:${DB_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:?DJANGO_DEBUG is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
      LOG_SERVICE_NAME: ${LOG_SERVICE_NAME:?LOG_SERVICE_NAME is required}
      LOG_ENVIRONMENT: ${LOG_ENVIRONMENT:?LOG_ENVIRONMENT is required}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/app/logs/medchain.jsonl}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:?DB_PORT is required}
      BACKEND_PORT: ${BACKEND_PORT:?BACKEND_PORT is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      MEDCHAIN_ADMIN_EMAIL: ${MEDCHAIN_ADMIN_EMAIL:?MEDCHAIN_ADMIN_EMAIL is required}
      MEDCHAIN_ADMIN_PASSWORD: ${MEDCHAIN_ADMIN_PASSWORD:?MEDCHAIN_ADMIN_PASSWORD is required}
      MEDIA_ROOT: ${MEDIA_ROOT:?MEDIA_ROOT is required}
      MEDIA_URL: ${MEDIA_URL:?MEDIA_URL is required}
      STORAGE_BACKEND: ${STORAGE_BACKEND:?STORAGE_BACKEND is required}
      MEDCHAIN_DEMO_PASSWORD: ${MEDCHAIN_DEMO_PASSWORD:?MEDCHAIN_DEMO_PASSWORD is required}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      FRONTEND_OAUTH_CALLBACK_URL: ${FRONTEND_OAUTH_CALLBACK_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - media:/app/media
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:' + '${BACKEND_PORT}' + '/api/docs/')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py seed &&
      gunicorn config.wsgi:application --bind 0.0.0.0:${BACKEND_PORT} --worker-tmp-dir /dev/shm --access-logfile - --error-logfile -"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    # pas de "ports" : le frontend n'est accessible que via le gateway

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - media:/media:ro
    environment:
      GATEWAY_LISTEN_PORT: ${GATEWAY_LISTEN_PORT:?GATEWAY_LISTEN_PORT is required}
      BACKEND_HOST: ${BACKEND_HOST:?BACKEND_HOST is required}
      BACKEND_PORT: ${BACKEND_PORT:?BACKEND_PORT is required}
      FRONTEND_HOST: ${FRONTEND_HOST:?FRONTEND_HOST is required}
      FRONTEND_PORT: ${FRONTEND_PORT:?FRONTEND_PORT is required}
    depends_on:
      - frontend
      - backend
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_LISTEN_PORT}"

volumes:
  pgdata:
  redisdata:
  media:
  elasticsearchdata: